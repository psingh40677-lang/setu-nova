<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#183b2b" />
    <title>You're offline | Setu Nova</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #fffefa; color: #22291f; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(32rem, calc(100% - 3rem)); padding: 2rem 0; }
      .mark { display: grid; width: 3rem; height: 3rem; place-items: center; border-radius: 50% 50% 48% 12%; background: #183b2b; color: #fffefa; font-size: 1.5rem; font-weight: 700; }
      h1 { margin: 2rem 0 0.75rem; color: #183b2b; font-size: clamp(1.75rem, 7vw, 2.5rem); }
      p { line-height: 1.7; }
      button { min-height: 3rem; margin-top: 1rem; padding: 0 1.25rem; border: 0; background: #183b2b; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #c16d4d; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <h1>You're offline</h1>
      <p>Some pages need an internet connection. Reconnect and try again.</p>
      <hr />
      <h1 lang="hi">आप ऑफ़लाइन हैं</h1>
      <p lang="hi">कुछ पेज देखने के लिए इंटरनेट कनेक्शन चाहिए। कनेक्शन मिलने पर फिर कोशिश करें।</p>
      <button type="button" onclick="location.reload()">Try again · फिर कोशिश करें</button>
    </main>
  </body>
</html>
